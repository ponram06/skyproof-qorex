# SkyProof website on a VM that already runs nginx (next to other sites).
# Copy to /etc/nginx/sites-available/skyproof, set server_name, then:
#   sudo ln -s /etc/nginx/sites-available/skyproof /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d skyproof.example.com      # HTTPS (needed for the browser wallet's crypto)
#
# The site is static (web/dist). The browser can't call the QoreChain testnet
# API directly (no CORS headers), so /api/rest and /api/rpc are proxied here,
# for the same read paths as api/proxy.ts, plus POST only to simulate or
# broadcast a transaction the visitor's browser already signed.

server {
    listen 80;
    server_name skyproof.example.com;            # <- your subdomain

    root /var/www/skyproof;
    index index.html;

    # The bundle (three.js, Leaflet, the PQC libraries) and skyproof.json are big: compress them.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location = /skyproof.json { add_header Cache-Control "no-cache"; }
    location = /skyproof-bodies.json { add_header Cache-Control "no-cache"; }
    # The page itself is never cached, so a deploy reaches returning visitors at once.
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }

    # REST: read-only paths the page uses
    location ~ ^/api/rest/(qorechain/(rdk|pqc|multilayer)/v1/|cosmos/(tx/v1beta1/(txs|simulate)|auth/v1beta1/accounts/|bank/v1beta1/balances/|upgrade/v1beta1/applied_plan/|base/tendermint/v1beta1/)) {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        rewrite ^/api/rest/(.*)$ /$1 break;
        proxy_pass https://api-testnet.qore.host;
        proxy_set_header Host api-testnet.qore.host;
        proxy_ssl_server_name on;
    }
    # RPC: chain status only
    location ~ ^/api/rpc/(status|block)$ {
        limit_except GET { deny all; }
        rewrite ^/api/rpc/(.*)$ /$1 break;
        proxy_pass https://rpc-testnet.qore.host;
        proxy_set_header Host rpc-testnet.qore.host;
        proxy_ssl_server_name on;
    }
    # The SkyProof service (deploy/skyproof.service): the judges' demo API
    location /api/demo/ {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    location /api/ { return 404; }
}
