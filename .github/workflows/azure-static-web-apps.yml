# Deploys the website (web/) and the read-only QoreChain proxy (azure/api/) to
# Azure Static Web Apps. Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (the deployment token of the Static Web App); without it the deploy step is skipped.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the website
        working-directory: web
        run: npm ci && npx vite build
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: azure/api
          skip_app_build: true
